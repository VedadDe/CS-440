<div>
    <h1>Kanvas crtanje kružnice</h1>
    <canvas #canvasRef width="600" height="400" (click)="onCanvasClick($event)"
        style="border:1px solid black;"></canvas>
</div>

<div>
    <button (click)="crtajKruznicu()" [disabled]="tacke.length < 2">Nacrtaj kružnicu između posljednje dvije dodane
        tačke</button>
    <button (click)="daLiJeTackaUKruznici()" [disabled]="tacke.length < 3">Provjeri da li se zadnja tačka nalazu
        unutar kružnice</button>
    <button (click)="daLiSegmentSijeceKruznicu()" [disabled]="tacke.length < 4">Provjeri da li segment između dvije
        posljednje tačke siječe kružnicu</button>
    <button (click)="ocistiCanvas()">Obriši tačke</button>
</div>

<div *ngIf="poruka" style="margin-top: 10px; font-weight: bold;">
    {{ poruka }}
</div>

<div>
    <h2>Lista tačaka</h2>
    <table border="1">
        <thead>
            <tr>
                <th>#</th>
                <th>X koordinata</th>
                <th>Y koordinata</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let point of tacke; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ point.x }}</td>
                <td>{{ point.y }}</td>
            </tr>
        </tbody>
    </table>
</div>
